name: Build IPA

# 定制打包流水线：产出「ad-hoc 签名 ipa」，供用户用 AltStore / SideStore / Sideloadly 自行重签安装。
# 三个 job：build-ipa（打包产物）、test（模拟器跑单测）、release（打 tag 时发布）。
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

# 同一分支只保留最新一次构建，避免排队堆积
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 镜像上可能有多个 Xcode，取最新的一个。
      # 顺便把候选与 SDK 列表打出来：排查「真机启动崩」时首先要确认产物
      # 到底是哪一代 SDK 编出来的（部署目标是 iOS 18，而镜像最新 Xcode 可能是 26）。
      - name: Select newest Xcode
        run: |
          echo "=== 镜像上可用的 Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          echo "选中: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "MangaTranslater.xcodeproj" \
            -scheme "MangaTranslater"

      # 归档阶段不签名（CODE_SIGNING_ALLOWED=NO）；ad-hoc 签名在打包步骤里用 codesign 完成。
          # 版本号优先取 tag（v0.0.3 → 0.0.3），分支构建用默认值；这样 tag 与 ipa 内版本永不漂移。
      - name: Resolve marketing version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # 分支构建的兜底版本号：与 pbxproj 的 MARKETING_VERSION 保持一致。
            # 正式发布仍然只认 tag（见 docs/development.md 的发版流程）。
            # 当前处于 0.x 开发期（源 API 契约未冻结）。
            VERSION="0.0.3"
          fi
          echo "版本号: $VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project "MangaTranslater.xcodeproj" \
            -scheme "MangaTranslater" \
            -destination "generic/platform=iOS" \
            -archivePath build/MangaTranslater.xcarchive \
            MARKETING_VERSION=${{ steps.ver.outputs.value }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Ad-hoc sign & package IPA
        run: |
          set -euo pipefail
          APP="build/MangaTranslater.xcarchive/Products/Applications/MangaTranslater.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未找到 .app 产物，打印 archive 内容以便排查"
            find build/MangaTranslater.xcarchive -maxdepth 4 -name "*.app" -print
            exit 1
          fi
          echo "=== 产物信息 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          TARGET="build/Payload/MangaTranslater.app"

          # 防回归：Xcode 26 的链接器默认把 __objc_protorefs 放进**只读**的
          # __DATA_CONST，而 iOS 18 的 libobjc 在 protocol fixup 阶段仍会写它
          # → 在 main() 之前 EXC_BAD_ACCESS(SIGBUS)。表现是「真机启动即闪退、
          # 模拟器与 CI 全绿」，极难自查。工程里加了 -Wl,-no_data_const 让它
          # 回到可写的 __DATA；这条检查直接盯着产物，比「记得那个标志还在」可靠。
          echo "=== __objc_protorefs / __objc_classlist 所在 segment ==="
          otool -l "$TARGET/MangaTranslater" | grep -A2 -E "__objc_protorefs|__objc_classlist" | grep -E "sectname|segname" || true
          if otool -l "$TARGET/MangaTranslater" | grep -A2 "__objc_protorefs" | grep -q "__DATA_CONST"; then
            echo "::error::__objc_protorefs 仍在 __DATA_CONST：iOS 18 真机会在启动时崩溃"
            exit 1
          fi

          # 清掉扩展属性 / 资源分叉，避免 codesign 报 detritus
          xattr -cr "$TARGET" || true

          # 用 Apple 官方 codesign 做 ad-hoc 签名（--sign -）。
          # 目的：给安装时的重签工具一个「已带代码签名」的基线 ——
          # 部分工具在「从零给完全无签名的二进制补签名」这条路径上会产出
          # SIGKILL - CODESIGNING，导致启动即闪退。
          if [ -d "$TARGET/PlugIns" ]; then
            for appex in "$TARGET/PlugIns"/*.appex; do
              [ -d "$appex" ] || continue
              echo "ad-hoc 签名扩展: $appex"
              codesign --force --sign - --timestamp=none "$appex"
            done
          fi
          echo "ad-hoc 签名主 App"
          codesign --force --sign - --timestamp=none "$TARGET"

          echo "=== 签名校验 ==="
          codesign -dv --verbose=4 "$TARGET" 2>&1 | sed -n '1,12p' || true
          codesign --verify --verbose=2 "$TARGET" || true

          cd build
          # 用 Apple 官方 ditto 打包（而不是 zip）：更能保留 bundle 属性，
          # 输出结构与 Apple 自家 ipa 一致，兼容各类安装器
          ditto -c -k --keepParent Payload MangaTranslater.ipa
          echo "=== ipa 结构自检 ==="
          unzip -l MangaTranslater.ipa | tail -3
          ls -lh MangaTranslater.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslater-ipa-${{ github.run_number }}
          path: build/MangaTranslater.ipa
          retention-days: 30

  # 回归测试 gate。与打包 job 相互独立 —— 即便测试挂了，ipa 产物照样上传，
  # 便于「先能装、再修测试」，但 workflow 整体会标红提醒。
  test:
    runs-on: macos-latest
    # 30 分钟不够了：测试目标里的文件数随里程碑增长，编译测试包本身就要十几分钟。
    # 实测过一次「编译 + 跑用例 ≈ 30 分钟」正好卡在旧上限上，job 被取消，
    # 白等一轮。给到 50 分钟，留出余量。
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          LATEST=${LATEST:-/Applications/Xcode.app}
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "MangaTranslater.xcodeproj" \
            -scheme "MangaTranslater"

      # 不写死机型：取当前镜像上最新 runtime 里可用的 iPhone 模拟器
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import sys, json
          devs = json.load(sys.stdin)['devices']
          pool = [d for rt in sorted(devs) for d in devs[rt] if 'iPhone' in d.get('name','')]
          print(pool[-1]['udid'] if pool else '')
          ")
          if [ -z "$UDID" ]; then
            echo "::error::镜像上没有可用的 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          echo "挑中模拟器: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # 真机 Vision 那一套**单独跑**。
      #
      # 原因：它 CPU 密集（大图 OCR），而 Vision 的识别调用会在协作线程池上
      # 阻塞住线程；与其它套件并行时，别的套件里 `Task.detached`（把 OCR 挪出主线程）
      # 会长时间抢不到线程，表现成「随机少了一页」——
      # 实测这条不稳定烧掉过三轮 CI（每次 12 分钟）。
      # 分开跑之后，剩下的套件只面对轻量 CPU 工作，等待型断言才真正可靠。
      - name: Run Vision (OCR) suite alone
        run: |
          set -o pipefail
          xcodebuild test \
            -project "MangaTranslater.xcodeproj" \
            -scheme "MangaTranslater" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -only-testing:MangaTranslaterTests/TranslationCoreTests \
            2>&1 | tee /tmp/ocr-tests.log
          # 守卫：过滤没生效（跑成 0 个用例）必须红，否则就是「假绿」
          grep -qE "Test run with [1-9][0-9]* tests" /tmp/ocr-tests.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "MangaTranslater.xcodeproj" \
            -scheme "MangaTranslater" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skip-testing:MangaTranslaterTests/TranslationCoreTests \
            2>&1 | tee /tmp/unit-tests.log
          # 守卫：一条都没跑（选择器写坏 / 构建失败被吞掉）必须红
          grep -qE "Test run with [0-9]{3,} tests" /tmp/unit-tests.log

  # 打 v* tag 时自动建 Release 并附上 ipa（用 runner 自带 gh + GITHUB_TOKEN，不需要 PAT）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "MangaTranslater-ipa-*"
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "${GITHUB_REF_NAME}" dist/MangaTranslater.ipa \
            --title "MangaTranslater ${GITHUB_REF_NAME}" \
            --notes "ad-hoc 签名 ipa（仅作重签基线），请用 AltStore / SideStore / Sideloadly 自行重签安装。详见 CHANGELOG.md。"

      # 生成 AltStore / SideStore 源清单，作为本次 Release 的附件上传。
      # 对外统一地址（加进 AltStore 后即可自动检查更新）：
      #   https://github.com/<owner>/<repo>/releases/latest/download/source.json
      # 必须放在 create release 之后——脚本要能扫到刚发布的这个版本。
      - name: Build AltStore source (source.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/build_altstore_source.py
          python3 -c "import json;d=json.load(open('source.json'));print('source.json 版本:',[v['version'] for v in d['apps'][0]['versions']])"

      - name: Upload source.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" source.json --clobber
